# kimodo_studio configuration — OPTIONAL, overrides only.
#
# Every value has a default, and the external repos default to the pinned
# extern/ submodules, so a fresh clone needs no config.yml at all. Create
# one only to override:
#
#   cp config.example.yml config.yml    # then uncomment what you change
#
# config.yml is gitignored — it is per-machine. Values may use ~ and
# $VARS. Set STUDIO_CONFIG to point somewhere else entirely.

# paths:
  # Clone of the kimodo repo: the viser demo and the diffusion model.
  # Default: the extern/kimodo submodule. Point this at your own fork to
  # hack on kimodo itself.
  # kimodo_repo: ~/Programs/kimodo

  # A SPIDER checkout (or a built .whl). Used ONLY by `studio setup`:
  # it copies the G1 assets out and builds the solve venv from it.
  # Nothing at run time touches this path.
  # Default: the extern/spider submodule.
  # spider: ~/Programs/spider

  # A unitree_g1 checkout with the BrainCo-hand model
  # (g1_29dof_mode_15_brainco_hand.urdf + meshes_brainco/). Used ONLY by
  # `studio setup --assets`, which copies the hand variant into assets/g1.
  # Optional: leave unset to run with the handless 29-DoF model.
  # unitree_g1: ~/Programs/unitree_g1

  # The two heavy runtimes `studio setup` creates. Defaults are
  # <this repo>/.venv-kimodo and <this repo>/.venv-solve; set these only
  # to reuse venvs you manage elsewhere.
  # kimodo_python: ~/venvs/kimodo/bin/python
  # solve_python:  ~/venvs/solve/bin/python

  # Default destination for `studio promote` — a central trial
  # collection outside this repo, if you keep one.
  # dataset_outputs: ~/datasets/kimodo/processed/kimodo/unitree_g1/humanoid_object

# Scene-reconstruction defaults; omit to use the values in
# studio.config.SCENE_DEFAULTS. All three GUIs expose these per run, so
# only set them here to change the starting point machine-wide.
# scene:
#   box_mass: 0.2          # kg
#   box_height: 0.20       # m
#   box_depth: 0.24        # m
#   squeeze: 0.008         # m, extra width so the reference hands press in
#   hand_geom: mesh        # mesh (rubber-hand hull) | capsule
#   floor_snap_below: 0.25 # m, below this the box extends down to the floor

# SBMPC solve hyperparameters; omit to use the values in
# studio.config.SOLVE_DEFAULTS. Everything else about the solve is fixed
# task setup and lives in studio/solve/spider_cfg.py.
# solve:
#   num_samples: 1024      # parallel worlds; lower this if the GPU OOMs
#   max_num_iterations: 16 # annealing iterations per control tick
#   knot_dt: 0.1           # s, spline knot spacing; snapped to a whole
#                          # number of sim steps that tiles the horizon
#   pos_rew_scale: 8.0     # object position — the objective
#   joint_rew_scale: 0.5   # robot pose — a guide only

# Per-task defaults overrides for the other downstream tasks (the scene:/
# solve: sections above are the box_carry task's). Scene keys per task are
# SCENE_DEFAULTS in src/studio/tasks/<task>.py, solve keys the shared
# SOLVE_DEFAULTS (src/studio/solve/defaults.py); `--set key=value`
# overrides per run.
# tasks:
#   pole:
#     scene:
#       object: auto           # a measured mesh under assets/object_mesh/
#                              # (floorlamp | tripod | ...) or auto
#                              # (from the clip name); the hold window
#                              # and hands are all detected
#       mass: 0.0              # kg; 0 = the object spec's default
#       grasp: auto            # ik_retargeted | reference | auto
#       left: auto             # per-hand contact window: auto | off |
#       right: auto            # S-E / S- inclusive frames
#     solve:
#       num_samples: 1024      # parallel worlds; lower this if the GPU OOMs
#   chair:                     # BEHAVE clips (raw_motion/behave), which
#     scene:                   # carry the chair's own pose per frame
#       object: auto           # a chair sidecar (chairwood | ...) or auto
#                              # (the clip's object_name); contact windows,
#                              # the sit and the chair's motion are detected
#       mass: 0.0              # kg; 0 = the object spec's default
#       grasp: auto            # ik_retargeted (arm re-posed onto a grasp
#                              # that fits the chair) | reference | auto
#       left: auto             # per-hand GRIP window: auto | off |
#       right: auto            # S-E / S- inclusive frames
#     solve:
#       grasp_rew_scale: 0.5   # reward per hand for palm/finger geoms
#                              # touching the chair (0 disables)
#       grasp_pen_rew_scale: 50  # penalty per metre of hand-chair
#                              # penetration beyond 5 mm (no caging)
#       support_rew_scale: 0.5 # keep the body supports (hip, torso,
#                              # forearms) the reference carries on
#       grip_rew_scale: 4.0    # hold the chair's anchors in the pockets
#       rot_rew_scale: 1.0     # a chair's orientation is the carry

# demo:
#   model: Kimodo-G1-RP-v1
#   port: 7860

# encoder:
  # SSH alias of the cluster login node (as in ~/.ssh/config);
  # `studio tunnel <node>` jumps through it to the compute node.
  # remote_host: euler
  # port: 9550
