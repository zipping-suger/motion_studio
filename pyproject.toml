[project]
name = "kimodo-studio"
version = "0.1.0"
description = "Interactive Kimodo clip authoring -> dynamically feasible G1 trajectory via mppi_locoma"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]
