[project]
name = "kimodo-studio"
version = "0.1.0"
description = "Interactive Kimodo clip authoring -> scene reconstruction -> dynamically feasible G1+object trajectory"
requires-python = ">=3.10"
# studio owns scene reconstruction, so it needs MuJoCo + numpy. The solve
# runs as a subprocess of the separate solve venv (torch/warp/SPIDER).
dependencies = ["pyyaml", "numpy", "mujoco==3.7.0"]

[project.scripts]
studio = "studio.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
